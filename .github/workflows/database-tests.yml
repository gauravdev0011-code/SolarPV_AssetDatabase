name: Database tests and acceptance

on:
  push:
    branches: [main, week-1-3-acceptance]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -v

      - name: Run Week 1-3 acceptance checks
        run: python scripts/verify_week3_acceptance.py
